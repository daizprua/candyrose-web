services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CONTABILI_API_URL: ${CONTABILI_API_URL}
      PUBLIC_BOOKING_TOKEN: ${PUBLIC_BOOKING_TOKEN}
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  dokploy-network:
    external: true
